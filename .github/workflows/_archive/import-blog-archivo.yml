# .github/workflows/import-blog-archivo.yml
# Workflow de ejecución ÚNICA (manual) para importar el blog archivo a Airtable.
# Después de correrlo exitosamente, puede deshabilitarse o moverse a _archive.

name: Importar Blog Archivo → Airtable

on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Correr importación
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: python3 import-blog-archivo.py
